name: 特性与设计提议 (Feature Proposal)
description: 提出符合《散页》反功利、重真实、高质感理念的功能或美学改进提议
title: "[Proposal]: "
labels: ["enhancement", "discussion"]
body:
  - type: markdown
    attributes:
      value: |
        《散页》（Loose Leaf）追求克制、宁静的实体出版物与银盐暗房质感，拒绝功利主义黑话与浮夸特效。
        我们欢迎任何有助于强化这一美学与使用体验的建设性提议。请确保内容中严格遵守零 Emoji 规范。
  - type: dropdown
    id: subsystem
    attributes:
      label: 涉及的子系统 (Target Subsystem)
      options:
        - "多端生态统筹 (Ecosystem-wide)"
        - "后端中枢 (Backend)"
        - "Web 官方展厅 (Web)"
        - "macOS 桌面工作台 (macOS)"
        - "Android 随行端 (Android)"
        - "架构规范与文档 (Docs)"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 现有痛点或未满足的生活场景 (Context / Problem Statement)
      description: 当前系统在哪些使用体验或生活记录场景中存在欠缺或不协调
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提议的具体方案与形态 (Proposed Solution)
      description: 建议如何设计该功能（包括视觉呈现、交互方式、数据流向）
    validations:
      required: true
  - type: textarea
    id: aesthetic_alignment
    attributes:
      label: 与《散页》实体书美学契合度考量 (Aesthetic & Tenets Alignment)
      description: 该特性如何融入自然大地色盘、离线优先发件箱、无损货币分级或生活母体记录哲学
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑过的替代方案 (Alternatives Considered)
      description: 是否有更克制、更低代码开销或更简单的替代路径
  - type: checkboxes
    id: checklist
    attributes:
      label: 确认自查
      options:
        - label: 我已确认提议内容严格遵循零 Emoji 规范
          required: true
        - label: 我已阅读全平台架构规范，确认提议不违背七大黄金法则
          required: true
